[project]
name = "khalij-ampt"
version = "0.1.0"
description = "Khalij-AMPT: MFI/density virtual sensor and 19-grade changeover sequence optimizer for Arya Sasol Polymer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
khalij-ampt = "khalij_ampt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
